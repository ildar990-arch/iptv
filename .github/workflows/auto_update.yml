name: Auto Update IPTV Playlist
on:
  schedule:
    - cron: '5 0 * * *' # Автозапуск каждую ночь в 03:05 по Московскому времени (00:05 UTC)
  workflow_dispatch: # Кнопка ручного запуска

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Проверка репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Запуск объединенного скрипта обновления
        run: |
          cat << 'EOF' > run_parser.py
          import urllib.request
          import urllib.error
          import re
          import base64
          from concurrent.futures import ThreadPoolExecutor, as_completed

          # Базы данных без дубликатов (зашифрованы в Base64)
          ENCRYPTED_SOURCES = [
              "aHR0cHM6Ly9yYXcuZ2l0aHVidXNlcmNvbnRlbnQuY29tL2JsYWNrYmlyZHN0dWRpb3J1cy9Mb2dhbmV0WElQVFYvbWFpbi9Mb2dhbmV0WEFsbC5tM3U=",
              "aHR0cHM6Ly9yYXcuZ2l0aHVidXNlcmNvbnRlbnQuY29tL0RpbW9ub3ZpY2gvVFYvRGltb25vdmljaC9GUkVFL1RW",
              "aHR0cHM6Ly9pcHR2LmZhbXpvbi5sdS9pcHR2LnR4dA==",
              "aHR0cHM6Ly9yYXcuZ2l0aHVidXNlcmNvbnRlbnQuY29tL3BwZ2VvL2lwdHYtbWNjL21hc3Rlci9wbGF5bGlzdC5tM3U=",
              "aHR0cHM6Ly9pbi1kZXgucnUvZnJlZS5tM3U=",
              "aHR0cHM6Ly9zYXRleHByZXNzdHYucnUvYXBrL3NldHYubTN1",
              "aHR0cHM6Ly9nY2xuay5jb20vbGY0SnRCTGM=",
              "aHR0cHM6Ly9yYXcuZ2l0aHVidXNlcmNvbnRlbnQuY29tL0lQVFZTSEFSRUQvVmVyb25hVFYvcmVmcy9oZWFkcy9tYWluL1Zlcm9uYVRWLm0zdU=="
          ]

          # Список любимых каналов
          FAVORITE_CHANNELS = [
              "нтв хит", "нтв", "моя планета", "неизвестная планета", "кино 1 international", 
              "индийское кино", "traveladventure", "rt doc", "Travel Channel ", "viju History", 
              "телепутешествия", "discovery", "нтв сериал", "nat geo wild", "docu box", "viju Explore ", "мосфильм"
              "Teleputeshestviya", "kino1int","kino_1_int","moya-planeta",
          ]

          # База проверенных логотипов для каналов
          LOGO_DATABASE = {
              "нтв": "https://githubusercontent.com",
              "нтв хит": "https://githubusercontent.com",
              "нтв сериал": "https://githubusercontent.com",
              "моя планета": "https://githubusercontent.com",
              "неизвестная планета": "https://githubusercontent.com",
              "кино 1 international": "https://githubusercontent.com",
              "индийское кино": "https://githubusercontent.com",
              "traveladventure": "https://githubusercontent.com",
              "rt doc": "https://githubusercontent.com",
              "телепутешествия": "https://githubusercontent.com",
              "discovery": "https://githubusercontent.com",
              "nat geo wild": "https://githubusercontent.com",
              "docu box": "https://githubusercontent.com",
              "tcl": "https://githubusercontent.com",
              "мосфильм": "https://githubusercontent.com"
          }

          def clean_string(s):
              return re.sub(r'[^a-zа-я0-9]', '', s.lower())

          def is_link_working(url):
              """Быстрая проверка линка методом GET с коротким таймаутом"""
              headers = {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
              }
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=4) as response:
                      if 200 <= response.status < 400:
                          return True
              except Exception:
                  pass
              return False

          def check_candidate(candidate):
              """Вспомогательная функция для потоков"""
              inf, url, fav_idx = candidate
              if is_link_working(url):
                  return (fav_idx, inf, url)
              return None

          def get_quality_score(candidate):
              """Извлекаем строку INF из первого элемента кортежа candidate"""
              inf_line = candidate[0].upper()
              keywords = ["HD", "FHD", "50FPS", "1080"]
              if any(word in inf_line for word in keywords):
                  return 1
              return 0

          def inject_logo(inf_line, clean_fav_name):
              """Внедряет или заменяет тег tvg-logo на основе базы данных"""
              logo_url = LOGO_DATABASE.get(clean_fav_name)
              if not logo_url:
                  return inf_line
              
              # Если тег tvg-logo уже есть, заменяем его, иначе вставляем после #EXTINF:-1
              if 'tvg-logo="' in inf_line:
                  inf_line = re.sub(r'tvg-logo="[^"]*"', f'tvg-logo="{logo_url}"', inf_line)
              else:
                  inf_line = inf_line.replace("#EXTINF:-1", f'#EXTINF:-1 tvg-logo="{logo_url}"')
                  inf_line = inf_line.replace("#EXTINF:0", f'#EXTINF:0 tvg-logo="{logo_url}"')
              return inf_line

          def main():
              combined_playlist = ["#EXTM3U\n"]
              sources = [base64.b64decode(url.encode()).decode() for url in ENCRYPTED_SOURCES]
              
              sorted_favorites = sorted(FAVORITE_CHANNELS, key=len, reverse=True)
              clean_favorites = [clean_string(fav) for fav in sorted_favorites]
              
              candidates_by_fav = {i: [] for i in range(len(sorted_favorites))}

              # Шаг 1: Собираем все совпадения из всех источников
              for url in sources:
                  try:
                      print(f"Парсинг источника: {url}")
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                      with urllib.request.urlopen(req, timeout=15) as response:
                          content = response.read().decode('utf-8', errors='ignore')
                          lines = content.splitlines()
                      
                      current_inf = None
                      for line in lines:
                          line_strip = line.strip()
                          if not line_strip:
                              continue
                          if line_strip.startswith("#EXTINF"):
                              current_inf = line_strip
                          elif line_strip.startswith("http") and current_inf:
                              clean_line_info = clean_string(current_inf)
                              
                              for i, clean_fav in enumerate(clean_favorites):
                                  if clean_fav in clean_line_info:
                                      candidates_by_fav[i].append((current_inf, line_strip, i))
                                      break
                              current_inf = None
                  except Exception as e:
                      print(f"Ошибка чтения источника {url}: {e}")

              # Шаг 2: Сортировка по качеству
              all_candidates = []
              for i in range(len(sorted_favorites)):
                  candidates_by_fav[i].sort(key=get_quality_score, reverse=True)
                  all_candidates.extend(candidates_by_fav[i])

              print(f"\nНайдено потенциальных ссылок для проверки: {len(all_candidates)}")
              print("Запуск многопоточной проверки ссылок...")

              valid_channels = {} 
              
              with ThreadPoolExecutor(max_workers=10) as executor:
                  futures = [executor.submit(check_candidate, c) for c in all_candidates]
                  for future in as_completed(futures):
                      res = future.result()
                      if res:
                          fav_idx, inf, url = res
                          if fav_idx not in valid_channels:
                              valid_channels[fav_idx] = (inf, url)
                              print(f" [+] Найден рабочий поток для: {sorted_favorites[fav_idx]}")

              # Шаг 3: Сборка итогового плейлиста из общих баз + внедрение логотипов
              seen_favorites_keys = set()
              for i in range(len(sorted_favorites)):
                  if i in valid_channels:
                      inf, url = valid_channels[i]
                      # Очищаем лишние группы, но оставляем структуру для логотипов
                      clean_inf_line = re.sub(r'group-title="[^"]*"', '', inf)
                      clean_inf_line = re.sub(r'\s+', ' ', clean_inf_line).strip()
                      
                      # Добавляем логотип
                      clean_inf_line = inject_logo(clean_inf_line, sorted_favorites[i])
                      
                      combined_playlist.append(f"{clean_inf_line}\n")
                      combined_playlist.append(f"{url}\n")
                      seen_favorites_keys.add(clean_favorites[i])

              # Шаг 4: Резервный блок ПРЯМЫХ ссылок
              direct_fallbacks = {
