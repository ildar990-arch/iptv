name: Auto Update IPTV Playlist
on:
  schedule:
    - cron: '0 05 * * *' # Автозапуск каждую ночь
  workflow_dispatch: # Кнопка ручного запуска

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Проверка репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Запуск объединенного скрипта обновления
        run: |
          cat << 'EOF' > run_parser.py
          import urllib.request
          import urllib.error
          import re
          import base64
          from concurrent.futures import ThreadPoolExecutor, as_completed

          # Базы данных (зашифрованы в Base64)
          ENCRYPTED_SOURCES = [
              "aHR0cHM6Ly9yYXcuZ2l0aHVidXNlcmNvbnRlbnQuY29tL2JsYWNrYmlyZHN0dWRpb3J1cy9Mb2dhbmV0WElQVFYvbWFpbi9Mb2dhbmV0WEFsbC5tM3U=",
              "aHR0cHM6Ly9yYXcuZ2l0aHVidXNlcmNvbnRlbnQuY29tL0RpbW9ub3ZpY2gvVFYvRGltb25vdmljaC9GUkVFL1RW",
              "aHR0cHM6Ly9sb2dhbmV0LnZlcmNlbC5hcHAvTG9nYW5ldFhBbGwubTN1",
              "aHR0cHM6Ly9sb2dhbmV0dHYudmVyY2VsLmFwcC9hbGwubTN1",
              "aHR0cHM6Ly9yYXcuZ2l0aHVidXNlcmNvbnRlbnQuY29tL0RpbW9ub3ZpY2gvVFYvRGltb25vdmljaC9GUkVFL1RWP20z",
              "aHR0cHM6Ly9pcHR2LmZhbXpvbi5sdS9pcHR2LnR4dA==",
              "aHR0cHM6Ly9yYXcuZ2l0aHVidXNlcmNvbnRlbnQuY29tL3BwZ2VvL2lwdHYtbWNjL21hc3Rlci9wbGF5bGlzdC5tM3U=",
              "aHR0cHM6Ly9pbi1kZXgucnUvZnJlZS5tM3U=",
              "aHR0cHM6Ly9zYXRleHByZXNzdHYucnUvYXBrL3NldHYubTN1",
              "aHR0cHM6Ly9nY2xuay5jb20vbGY0SnRCTGM=",
              "aHR0cHM6Ly9yYXcuZ2l0aHVidXNlcmNvbnRlbnQuY29tL0lQVFZTSEFSRUQvVmVyb25hVFYvcmVmcy9oZWFkcy9tYWluL1Zlcm9uYVRWLm0zdU=="
          ]

          # Список любимых каналов
          FAVORITE_CHANNELS = [
              "нтв хит", "нтв", "моя планета", "неизвестная планета", "кино 1 international", 
              "индийское кино", "traveladventure", "rt doc", "viju explore", "viju history", 
              "телепутешествия", "discovery", "нтв сериал", "nat geo wild", "docu box", "tcl", "мосфильм"
          ]

          def clean_string(s):
              return re.sub(r'[^a-zа-я0-9]', '', s.lower())

          def is_link_working(url):
              """Быстрая проверка линка методом GET с коротким таймаутом"""
              headers = {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
              }
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=4) as response:
                      if 200 <= response.status < 400:
                          return True
              except Exception:
                  pass
              return False

          def check_candidate(candidate):
              """Вспомогательная функция для потоков"""
              inf, url, fav_idx = candidate
              if is_link_working(url):
                  return (fav_idx, inf, url)
              return None

          def get_quality_score(candidate):
              """Возвращает 1, если канал в HD качестве, и 0 для обычного качества"""
              inf_line = candidate.upper()
              keywords = ["HD", "FHD", "50FPS", "1080"]
              if any(word in inf_line for word in keywords):
                  return 1
              return 0

          def main():
              combined_playlist = ["#EXTM3U\n"]
              sources = [base64.b64decode(url.encode()).decode() for url in ENCRYPTED_SOURCES]
              
              sorted_favorites = sorted(FAVORITE_CHANNELS, key=len, reverse=True)
              clean_favorites = [clean_string(fav) for fav in sorted_favorites]
              
              # Словарь для сбора кандидатов
              candidates_by_fav = {i: [] for i in range(len(sorted_favorites))}

              # Шаг 1: Собираем все совпадения из всех источников
              for url in sources:
                  try:
                      print(f"Парсинг источника: {url}")
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                      with urllib.request.urlopen(req, timeout=15) as response:
                          content = response.read().decode('utf-8', errors='ignore')
                          lines = content.splitlines()
                      
                      current_inf = None
                      for line in lines:
                          line_strip = line.strip()
                          if not line_strip:
                              continue
                          if line_strip.startswith("#EXTINF"):
                              current_inf = line_strip
                          elif line_strip.startswith("http") and current_inf:
                              clean_line_info = clean_string(current_inf)
                              
                              for i, clean_fav in enumerate(clean_favorites):
                                  if clean_fav in clean_line_info:
                                      candidates_by_fav[i].append((current_inf, line_strip, i))
                                      break
                              current_inf = None
                  except Exception as e:
                      print(f"Ошибка чтения источника {url}: {e}")

              # Шаг 2: Сортировка по качеству через безопасную функцию
              all_candidates = []
              for i in range(len(sorted_favorites)):
                  candidates_by_fav[i].sort(key=get_quality_score, reverse=True)
                  all_candidates.extend(candidates_by_fav[i])

              print(f"\nНайдено потенциальных ссылок для проверки: {len(all_candidates)}")
              print("Запуск многопоточной проверки ссылок...")

              valid_channels = {} # { fav_idx: (inf, url) }
              
              with ThreadPoolExecutor(max_workers=10) as executor:
                  futures = [executor.submit(check_candidate, c) for c in all_candidates]
                  for future in as_completed(futures):
                      res = future.result()
                      if res:
                          fav_idx, inf, url = res
                          if fav_idx not in valid_channels:
                              valid_channels[fav_idx] = (inf, url)
                              print(f" [+] Найден рабочий поток для: {sorted_favorites[fav_idx]}")

              # Шаг 3: Сборка итогового плейлиста из общих баз
              seen_favorites_keys = set()
              for i in range(len(sorted_favorites)):
                  if i in valid_channels:
                      inf, url = valid_channels[i]
                      clean_inf_line = re.sub(r'group-title="[^"]*"', '', inf)
                      clean_inf_line = re.sub(r'\s+', ' ', clean_inf_line).strip()
                      
                      combined_playlist.append(f"{clean_inf_line}\n")
                      combined_playlist.append(f"{url}\n")
                      seen_favorites_keys.add(clean_favorites[i])

              # Шаг 4: Резервный блок ПРЯМЫХ ссылок пользователя
              direct_fallbacks = {
                  "discovery": ("#EXTINF:-1,Discovery Channel", "aHR0cHM6Ly9yaXZlci0zLTM4NC5ydGJjZG4ucnUvc3RyZWFtL2dlbmV0dGEtNDA4Lm50di5ydXR1YmUucnUvMWd0Nk8zWHo1ZFFNdHFTREd4VG1nQS8xNzkxMDMzNjA2LzY0MjVkNjJmN2UxZjg3YmMzYWVjNDViNDYyY2Q4OWVhLzEwODBwX3N0cmVhbS5tM3U4"),
                  "tcl": ("#EXTINF:-1,TCL", "aHR0cHM6Ly9yaXZlci0zLTM0Ny5ydGJjZG4ucnUvc3RyZWFtL2dlbmV0dGEtMzEzLm05LnJ1dHViZS5ydS9sLUVxOW15RTd4X1NoRWJZN0xNM2xnLzE3OTEwMzM3MDgvN2MzZDFhNGNjMGI0ZGZmMTE3NmFhMmRiYjBiOTAwMDAvMTA4MHBfc3RyZWFtLm0zdTg="),
                  "кино1": ("#EXTINF:-1,Кино 1", "aHR0cHM6Ly9raW5vLTEuY2F0Y2FzdC50di9jb250ZW50LzM4NjE3L2luZGV4Lm0zdTg="),
                  "мосфильм": ("#EXTINF:-1,Мосфильм", "aHR0cHM6Ly9lZGdlMDItYWxtLmJlZXR2Lmt6L2Jway10b2tlbi80YW5AZmY0NTF1bmJ6NXB0d3ZqNHljbmxxMjV4amRqcjU1Z25mMXEwMWpkYS9icGstdHYvMDAwMDA2MzY1L3R2ZS8wMDAwMDYzNjUtYXVkaW9fODI4ODJfcnVzPTgyNDAwLXZpZGVvPTIxMzc2MDAubTN1OA=="),
                  "мояпланета": ("#EXTINF:-1,Моя Планета", "aHR0cHM6Ly9yaXRzYXR2LnJ1L3N0cmVhbS8wMDAwMDEwNDkvdHZlL2luZGV4Lm0zdTg="),
                  "телепутешествия": ("#EXTINF:-1,Телепутешествия", "aHR0cHM6Ly9taXguY2RudHZ0ZWNoLmNvbS8zL2xpdmV0di5waHA/c2lkPTQ1M2VmNjY0MmNkMjM4MjY0NzQwNTdhJnA9dHJhY2tzLXYxYTFfcmF3Lm0zdTgmZXhwPTE3OTA0NDI2Mzcmc2lnPTA0MjVkZDllZDNjMjV3ZTFiNWVhMWE2NzJjOWYxMWJkNGRlZGI2OWM3ZGI2NjJiOTI0OGNhODRmdDM5NTA5NDg=")
              }

              for fav_clean_name, (inf_text, encrypted_url) in direct_fallbacks.items():
                  if fav_clean_name not in seen_favorites_keys:
                      real_url = encrypted_url if encrypted_url.startswith("http") else base64.b64decode(encrypted_url.encode()).decode()
                      if is_link_working(real_url):
                          combined_playlist.append(f"{inf_text}\n")
                          combined_playlist.append(f"{real_url}\n")
                          seen_favorites_keys.add(fav_clean_name)
                          print(f" [+++] Добавлен из ПРЯМОГО источника: {fav_clean_name}")

              with open("playlist.m3u", "w", encoding="utf-8") as f:
                  f.writelines(combined_playlist)
              
              print(f"\nИтоговый результат: успешно сопряжено каналов: {len(seen_favorites_keys)}")

          if __name__ == "__main__":
              main()
          EOF
          python run_parser.py

      - name: Пуш обновленного плейлиста
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add playlist.m3u
          git diff --staged --quiet || (git commit -m "Автоматическое обновление плейлиста [skip ci]" && git push)
