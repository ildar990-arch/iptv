name: Auto Update IPTV Playlist
on:
  schedule:
    - cron: '0 05 * * *' # Автозапуск каждую ночь
  workflow_dispatch: # Кнопка ручного запуска

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Проверка репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Запуск объединенного скрипта обновления
        run: |
          cat << 'EOF' > run_parser.py
          import urllib.request
          import urllib.error
          import re
          import base64

          # Базы данных (зашифрованы в Base64)
          ENCRYPTED_SOURCES = [
              "aHR0cHM6Ly9yYXcuZ2l0aHVidXNlcmNvbnRlbnQuY29tL2JsYWNrYmlyZHN0dWRpb3J1cy9Mb2dhbmV0WElQVFYvbWFpbi9Mb2dhbmV0WEFsbC5tM3U=",
              "aHR0cHM6Ly9yYXcuZ2l0aHVidXNlcmNvbnRlbnQuY29tL0RpbW9ub3ZpY2gvVFYvRGltb25vdmljaC9GUkVFL1RW",
              "aHR0cHM6Ly9sb2dhbmV0LnZlcmNlbC5hcHAvTG9nYW5ldFhBbGwubTN1",
              "aHR0cHM6Ly9sb2dhbmV0dHYudmVyY2VsLmFwcC9hbGwubTN1",
              "aHR0cHM6Ly9yYXcuZ2l0aHVidXNlcmNvbnRlbnQuY29tL0RpbW9ub3ZpY2gvVFYvRGltb25vdmljaC9GUkVFL1RWP20z"
          ]

          # Список любимых каналов
          FAVORITE_CHANNELS = [
              "нтв хит", "нтв", "моя планета", "неизвестная планета", "кино 1 international", 
              "индийское кино", "traveladventure", "rt doc", "viju explore", "viju history", 
              "телепутешествия", "discovery", "нтв сериал", "nat geo wild", "docu box"
          ]

          def clean_string(s):
              return re.sub(r'[^a-zа-я0-9]', '', s.lower())

          def is_link_working(url):
              """Проверяет доступность стрима: сначала HEAD, при отказе - коротким GET с таймаутом 5с"""
              headers = {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                  'Accept': '*/*'
              }
              
              # 1. Попытка через HEAD
              try:
                  req = urllib.request.Request(url, method='HEAD', headers=headers)
                  with urllib.request.urlopen(req, timeout=5) as response:
                      if 200 <= response.status < 400:
                          return True
              except urllib.error.HTTPError as e:
                  if e.code in (403, 405, 501):
                      pass
                  else:
                      return False
              except Exception:
                  pass

              # 2. Попытка через GET (запрашиваем только заголовки)
              try:
                  req = urllib.request.Request(url, method='GET', headers=headers)
                  with urllib.request.urlopen(req, timeout=5) as response:
                      if 200 <= response.status < 400:
                          return True
              except urllib.error.HTTPError as e:
                  if e.code >= 500:
                      return False
              except Exception:
                  return False
                  
              return True

          def main():
              combined_playlist = ["#EXTM3U\n"]
              seen_favorites = set()
              found_count = 0

              sorted_favorites = sorted(FAVORITE_CHANNELS, key=len, reverse=True)
              clean_favorites = [clean_string(fav) for fav in sorted_favorites]
              sources = [base64.b64decode(url.encode()).decode() for url in ENCRYPTED_SOURCES]

              for url in sources:
                  try:
                      print(f"Скачивание источника: {url}")
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                      with urllib.request.urlopen(req, timeout=30) as response:
                          content = response.read().decode('utf-8', errors='ignore')
                          lines = content.splitlines()
                      
                      current_inf = None
                      
                      for line in lines:
                          line_strip = line.strip()
                          if not line_strip:
                              continue
                              
                          if line_strip.startswith("#EXTINF"):
                              current_inf = line_strip
                          elif line_strip.startswith("http"):
                              if current_inf:
                                  clean_line_info = clean_string(current_inf)
                                  
                                  for i, clean_fav in enumerate(clean_favorites):
                                      if clean_fav in clean_line_info and clean_fav not in seen_favorites:
                                          
                                          print(f" Проверка ссылки для канала [{sorted_favorites[i]}]...", end="", flush=True)
                                          if is_link_working(line_strip):
                                              seen_favorites.add(clean_fav)
                                              
                                              # Очищаем строку #EXTINF от любых упоминаний group-title="..."
                                              clean_inf_line = re.sub(r'group-title="[^"]*"', '', current_inf)
                                              # Убираем возможные двойные пробелы, возникшие после удаления группы
                                              clean_inf_line = re.sub(r'\s+', ' ', clean_inf_line).strip()
                                              
                                              combined_playlist.append(f"{clean_inf_line}\n")
                                              combined_playlist.append(f"{line_strip}\n")
                                              
                                              found_count += 1
                                              print(" ДОБАВЛЕН!")
                                              break
                                          else:
                                              print(" МЕРТВАЯ (пропуск)")
                                  
                                  current_inf = None
                                  
                  except Exception as e:
                      print(f"Сбой источника {url}: {e}")

              # Резервный блок для Кино 1
              if "кино1" not in seen_favorites:
                  direct_kino1 = base64.b64decode("aHR0cHM6Ly9raW5vLTEuY2F0Y2FzdC50di9jb250ZW50LzM4NjE3L2luZGV4Lm0zdTg=").decode()
                  combined_playlist.append('#EXTINF:-1,Кино 1\n')
                  combined_playlist.append(f"{direct_kino1}\n")
                  seen_favorites.add("кино1")
                  found_count += 1
                  print(" +++ ДОБАВЛЕН ИЗ ПРЯМОГО ИСТОЧНИКА: кино 1")

              with open("playlist.m3u", "w", encoding="utf-8") as f:
                  f.writelines(combined_playlist)
              
              print(f"\nИтоговый результат: сохранено уникальных рабочих каналов: {found_count}")

          if __name__ == "__main__":
              main()
          EOF
          python run_parser.py

      - name: Пуш обновленного плейлиста
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add playlist.m3u
          if git diff --staged --quiet; then
            echo "Изменений нет. Плейлист актуален."
          else
            git commit -m "Автоматическое обновление плейлиста [skip ci]"
            git push
          fi
