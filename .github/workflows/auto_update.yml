name: update

on:
  schedule:
    - cron: '0 0 * * *'  # Запуск каждую ночь в 03:00 по МСК (00:00 UTC)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Защита: даем скрипту до 15 минут на тщательную проверку всех потоков
    
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Запускаем наш умный парсер с проверкой битрейта
      - name: Run parser
        run: python run_parser.py

      - name: Commit and Push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated playlist update" && git push)
