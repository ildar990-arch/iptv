name: Auto Update IPTV Playlist

on:
  schedule:
    - cron: '0 0 * * *' # Автозапуск каждую ночь
  workflow_dispatch: # Кнопка ручного запуска

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Проверка репозитория
      uses: actions/checkout@v4

    - name: Настройка Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Запуск объединенного скрипта обновления
      run: |
        cat << 'EOF' > run_parser.py
        import urllib.request
        import re
        import base64

        # Базы данных (зашифрованы в Base64)
        ENCRYPTED_SOURCES = [
            "aHR0cHM6Ly9yYXcuZ2l0aHVidXNlcmNvbnRlbnQuY29tL2JsYWNrYmlyZHN0dWRpb3J1cy9Mb2dhbmV0WElQVFYvbWFpbi9Mb2dhbmV0WEFsbC5tM3U=",
            "aHR0cHM6Ly9yYXcuZ2l0aHVidXNlcmNvbnRlbnQuY29tL0RpbW9ub3ZpY2gvVFYvRGltb25vdmljaC9GUkVFL1RW",
            "aHR0cHM6Ly9sb2dhbmV0LnZlcmNlbC5hcHAvTG9nYW5ldFhBbGwubTN1",
            "aHR0cHM6Ly9sb2dhbmV0dHYudmVyY2VsLmFwcC9hbGwubTN1"
        ]

        # Список любимых каналов
        FAVORITE_CHANNELS = [
            "нтв сериалы",
            "нтв хит",
            "нтв",
            "моя планета",
            "неизвестная планета",
            "кино 1 international",
            "кино 1",
            "индийское кино",
            "traveladventure",
            "rtg doc",
            "rtg",
            "телепутешествия",
            "discovery"
        ]

        def clean_string(s):
            return re.sub(r'[^a-zа-я0-9]', '', s.lower())

        def main():
            combined_playlist = ["#EXTM3U\n"]
            seen_favorites = set()
            found_count = 0
            
            sorted_favorites = sorted(FAVORITE_CHANNELS, key=len, reverse=True)
            clean_favorites = [clean_string(fav) for fav in sorted_favorites]
            sources = [base64.b64decode(url.encode()).decode() for url in ENCRYPTED_SOURCES]

            # 1. Сначала ищем каналы по большим базам данных
            for url in sources:
                try:
                    print(f"Скачивание источника: {url}")
                    req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                    with urllib.request.urlopen(req, timeout=30) as response:
                        content = response.read().decode('utf-8', errors='ignore')
                        
                    lines = content.splitlines()
                    
                    for idx, line in enumerate(lines):
                        line_strip = line.strip()
                        if line_strip.startswith("#EXTINF"):
                            line_clean = clean_string(line_strip)
                            for i, clean_fav in enumerate(clean_favorites):
                                if clean_fav in line_clean and clean_fav not in seen_favorites:
                                    url_found = None
                                    meta_lines = []
                                    for step in range(1, 15):
                                        if idx + step >= len(lines): break
                                        next_line = lines[idx + step].strip()
                                        if next_line.startswith("#EXTINF"): break
                                        if next_line.startswith("http"):
                                            url_found = next_line
                                            break
                                        if next_line and not next_line.startswith("#EXTGRP"): 
                                            meta_lines.append(next_line)
                                    
                                    if url_found:
                                        seen_favorites.add(clean_fav)
                                        clean_inf_line = re.sub(r'group-title="[^"]*"', '', line_strip)
                                        clean_inf_line = re.sub(r'\s+', ' ', clean_inf_line)
                                        
                                        combined_playlist.append(f"{clean_inf_line}\n")
                                        for meta in meta_lines: combined_playlist.append(f"{meta}\n")
                                        combined_playlist.append(f"{url_found}\n")
                                        found_count += 1
                                        print(f"  +++ НАЙДЕН И ДОБАВЛЕН: {sorted_favorites[i]}")
                                        break
                except Exception as e:
                    print(f"Сбой источника {url}: {e}")

            # 2. РЕЗЕРВНЫЙ БЛОК: Если канал "кино 1" не нашелся в базах, берем вашу прямую ссылку
            if "кино1" not in seen_favorites:
                # Расшифровываем прямую ссылку на Кино 1 (https://kino-1.catcast.tv/content/38617/index.m3u8)
                direct_kino1 = base64.b64decode("aHR0cHM6Ly9raW5vLTEuY2F0Y2FzdC50di9jb250ZW50LzM4NjE3L2luZGV4Lm0zdTg=").decode()
                combined_playlist.append('#EXTINF:-1,Кино 1\n')
                combined_playlist.append(f"{direct_kino1}\n")
                seen_favorites.add("кино1")
                found_count += 1
                print("  +++ ДОБАВЛЕН ИЗ ПРЯМОГО ИСТОЧНИКА: кино 1")

            with open("playlist.m3u", "w", encoding="utf-8") as f:
                f.writelines(combined_playlist)
            print(f"Итоговый результат: сохранено уникальных каналов {found_count}")

        if __name__ == "__main__":
            main()
        EOF
        python run_parser.py

    - name: Пуш обновленного плейлиста
      run: |
        git config --local user.email "github-actions[bot]@://github.com"
        git config --local user.name "github-actions[bot]"
        git add playlist.m3u
        if git diff --staged --quiet; then
          echo "Изменений нет. Плейлист актуален."
        else
          git commit -m "Автоматическое обновление плейлиста [skip ci]"
          git push
        fi
