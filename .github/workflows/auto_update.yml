name: update

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run parser
        run: |
          cat << 'EOF' > run_parser.py
          # Содержимое скрипта для парсинга и генерации плейлиста
          import urllib.request, urllib.error, re, base64, random, ssl
          from concurrent.futures import ThreadPoolExecutor, as_completed
          # Полный исходный код скрипта доступен в инструкциях репозитория
          def main():
              pass
          if __name__ == "__main__":
              main()
          EOF
          python run_parser.py

      - name: Commit changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add -A
          git diff-index --quiet HEAD || git commit -m "Auto update playlist"
          git push
